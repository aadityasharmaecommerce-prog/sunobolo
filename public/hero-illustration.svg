<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="500" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.15"/>
    </filter>
    <filter id="phoneShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bg)"/>

  <!-- Girl Body -->
  <ellipse cx="340" cy="420" rx="70" ry="50" fill="#3b82f6"/>
  <rect x="290" y="340" width="100" height="90" rx="12" fill="#3b82f6"/>

  <!-- Girl Head -->
  <circle cx="340" cy="290" r="45" fill="#fbbf24"/>

  <!-- Hair -->
  <path d="M295 275 Q295 230 340 225 Q385 230 385 275 L385 260 Q385 220 340 215 Q295 220 295 260 Z" fill="url(#hair)"/>
  <path d="M295 275 Q285 280 280 300 Q275 320 285 340" fill="url(#hair)" stroke="none"/>
  <path d="M385 275 Q395 280 400 300 Q405 320 395 340" fill="url(#hair)" stroke="none"/>

  <!-- Face -->
  <circle cx="325" cy="288" r="3" fill="#1e293b"/>
  <circle cx="355" cy="288" r="3" fill="#1e293b"/>
  <path d="M328 300 Q340 310 352 300" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Arms -->
  <path d="M290 360 Q260 350 250 320" stroke="#fbbf24" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M390 360 Q420 350 430 320" stroke="#fbbf24" stroke-width="12" fill="none" stroke-linecap="round"/>

  <!-- Books in arms -->
  <rect x="240" y="310" width="30" height="40" rx="3" fill="#10b981" transform="rotate(-10 255 330)"/>
  <rect x="250" y="305" width="30" height="40" rx="3" fill="#f59e0b" transform="rotate(5 265 325)"/>
  <rect x="415" y="310" width="25" height="35" rx="3" fill="#8b5cf6" transform="rotate(8 427 327)"/>

  <!-- Phone Mockup -->
  <g filter="url(#phoneShadow)">
    <rect x="80" y="120" width="170" height="300" rx="20" fill="url(#phone)"/>
    <!-- Notch -->
    <rect x="135" y="128" width="60" height="5" rx="2.5" fill="#475569"/>
    <!-- Screen -->
    <rect x="90" y="140" width="150" height="270" rx="14" fill="white"/>

    <!-- Counter -->
    <text x="220" y="160" font-size="8" fill="#94a3b8" text-anchor="end" font-weight="600">1 of 25</text>

    <!-- Progress bar -->
    <rect x="96" y="166" width="138" height="3" rx="1.5" fill="#e2e8f0"/>
    <rect x="96" y="166" width="35" height="3" rx="1.5" fill="url(#btn)"/>

    <!-- Label -->
    <text x="100" y="182" font-size="7" fill="#94a3b8" font-weight="600">English Sentence</text>

    <!-- Sentence -->
    <rect x="96" y="188" width="138" height="28" rx="6" fill="#f8fafc"/>
    <text x="104" y="205" font-size="9" fill="#0f172a" font-weight="700">I'm going to be</text>
    <text x="104" y="214" font-size="9" fill="#0f172a" font-weight="700">a little late.</text>
    <text x="226" y="205" font-size="10" fill="#0ea5e9">🔊</text>

    <!-- Hindi label -->
    <text x="100" y="228" font-size="7" fill="#94a3b8" font-weight="600">Hindi Meaning</text>

    <!-- Hindi -->
    <rect x="96" y="232" width="138" height="22" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="0.5"/>
    <text x="104" y="247" font-size="8" fill="#166534">मुझे थोड़ी देर हो जाएगी।</text>

    <!-- Listen section -->
    <text x="100" y="268" font-size="7" fill="#94a3b8" font-weight="600">Listen 3 Times</text>
    <rect x="96" y="274" width="38" height="16" rx="8" fill="#dbeafe"/>
    <text x="106" y="285" font-size="7" fill="#2563eb" font-weight="700">🔊 1</text>
    <rect x="140" y="274" width="38" height="16" rx="8" fill="#f1f5f9"/>
    <text x="150" y="285" font-size="7" fill="#64748b" font-weight="700">🔊 2</text>
    <rect x="184" y="274" width="38" height="16" rx="8" fill="#f1f5f9"/>
    <text x="194" y="285" font-size="7" fill="#64748b" font-weight="700">🔊 3</text>

    <!-- Speak section -->
    <text x="100" y="306" font-size="7" fill="#94a3b8" font-weight="600">Speak 3 Times</text>
    <rect x="96" y="312" width="38" height="16" rx="8" fill="#fef3c7"/>
    <text x="106" y="323" font-size="7" fill="#d97706" font-weight="700">🎤 1</text>
    <rect x="140" y="312" width="38" height="16" rx="8" fill="#f1f5f9"/>
    <text x="150" y="323" font-size="7" fill="#64748b" font-weight="700">🎤 2</text>
    <rect x="184" y="312" width="38" height="16" rx="8" fill="#f1f5f9"/>
    <text x="194" y="323" font-size="7" fill="#64748b" font-weight="700">🎤 3</text>

    <!-- Done -->
    <rect x="96" y="338" width="138" height="18" rx="4" fill="#dcfce7"/>
    <text x="108" y="350" font-size="8" fill="#166534" font-weight="700">✓ Sentence Complete</text>

    <!-- Next -->
    <text x="165" y="370" font-size="8" fill="#0ea5e9" font-weight="700" text-anchor="middle">Next Sentence →</text>
  </g>

  <!-- Sticky Note 1 (top-right) -->
  <g transform="translate(400, 100) rotate(3)">
    <rect width="90" height="100" rx="4" fill="#fef3c7" filter="url(#shadow)"/>
    <text x="10" y="22" font-size="9" fill="#92400e" font-weight="600">Aaj Ka</text>
    <text x="10" y="36" font-size="9" fill="#92400e" font-weight="600">Ek Sentence,</text>
    <text x="10" y="50" font-size="9" fill="#92400e" font-weight="600">Kal Ki Ek</text>
    <text x="10" y="64" font-size="9" fill="#92400e" font-weight="600">Confident</text>
    <text x="10" y="78" font-size="9" fill="#92400e" font-weight="600">Conversation.</text>
  </g>

  <!-- Sticky Note 2 (bottom-left) -->
  <g transform="translate(20, 380) rotate(-2)">
    <rect width="100" height="80" rx="4" fill="#fce7f3" filter="url(#shadow)"/>
    <text x="10" y="20" font-size="8" fill="#9d174d" font-weight="600">Perfect hone ka</text>
    <text x="10" y="34" font-size="8" fill="#9d174d" font-weight="600">wait mat kijiye,</text>
    <text x="10" y="48" font-size="8" fill="#9d174d" font-weight="600">practice aaj se</text>
    <text x="10" y="62" font-size="8" fill="#9d174d" font-weight="600">shuru kijiye. 😊</text>
  </g>

  <!-- Decorative dots -->
  <circle cx="50" cy="100" r="4" fill="#0ea5e9" opacity="0.3"/>
  <circle cx="70" cy="130" r="3" fill="#6366f1" opacity="0.3"/>
  <circle cx="460" cy="350" r="5" fill="#10b981" opacity="0.3"/>
  <circle cx="440" cy="400" r="3" fill="#f59e0b" opacity="0.3"/>
</svg>
