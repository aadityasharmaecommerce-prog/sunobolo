<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delete Account — SunoBolo English</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }
    h1 { font-size: 22px; color: #1a1a2e; margin-bottom: 8px; }
    .subtitle { color: #666; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
    .warning {
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 24px;
      font-size: 13px;
      color: #856404;
      line-height: 1.5;
    }
    .warning strong { display: block; margin-bottom: 4px; }
    label { display: block; font-size: 14px; font-weight: 600; color: #333; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      margin-bottom: 16px;
      transition: border 0.2s;
    }
    input:focus { outline: none; border-color: #667eea; }
    button {
      width: 100%;
      padding: 14px;
      background: #e74c3c;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #c0392b; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .result {
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      display: none;
    }
    .result.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; display: block; }
    .result.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; display: block; }
    .footer { margin-top: 20px; text-align: center; font-size: 12px; color: #999; }
    .footer a { color: #667eea; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🗑️ Delete Your Account</h1>
    <p class="subtitle">Permanently delete your SunoBolo English account and all associated data.</p>

    <div class="warning">
      <strong>⚠️ This action is permanent and cannot be undone.</strong>
      All your progress, subscription data, and personal information will be permanently erased.
    </div>

    <form id="deleteForm">
      <label for="phone">Registered Mobile Number</label>
      <input type="tel" id="phone" placeholder="e.g. 9876543210" required maxlength="15" autocomplete="tel">

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">

      <button type="submit" id="submitBtn">Delete My Account & Data</button>
    </form>

    <div id="result" class="result"></div>

    <div class="footer">
      <p><a href="https://sunobolo.in/privacy-policy">Privacy Policy</a></p>
    </div>
  </div>

  <script>
    const form = document.getElementById('deleteForm');
    const submitBtn = document.getElementById('submitBtn');
    const resultDiv = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;

      if (!phone || !password) {
        showResult('Please enter both mobile number and password.', 'error');
        return;
      }

      if (!confirm('Are you absolutely sure? This will permanently delete your account and ALL data. This cannot be undone.')) {
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Deleting...';
      resultDiv.className = 'result';
      resultDiv.style.display = 'none';

      try {
        const res = await fetch('/api/auth/delete-account', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password }),
        });

        const data = await res.json();

        if (res.ok && data.ok) {
          showResult('✅ Your account and all associated data have been permanently deleted. You may now close this page.', 'success');
          form.style.display = 'none';
        } else {
          showResult(data.error || 'Failed to delete account. Please check your credentials.', 'error');
        }
      } catch (err) {
        showResult('Network error. Please try again later.', 'error');
      }

      submitBtn.disabled = false;
      submitBtn.textContent = 'Delete My Account & Data';
    });

    function showResult(message, type) {
      resultDiv.textContent = message;
      resultDiv.className = 'result ' + type;
      resultDiv.style.display = 'block';
    }
  </script>
</body>
</html>
